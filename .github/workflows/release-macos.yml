name: Release macOS

# 推送 v* 标签（如 v3.0.0）时，在 macOS 上测试、打包 universal dmg 并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（例如 v3.0.0），留空则只打包不发布'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: EasyTranslate-macOS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: EasyTranslate-macOS/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build universal dmg
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyTranslate-macOS
          path: EasyTranslate-macOS/dist/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          NOTES="../.github/release-notes/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" dist/*.dmg --title "EasyTranslate ${TAG}" --notes-file "$NOTES"
          else
            gh release create "$TAG" dist/*.dmg --title "EasyTranslate ${TAG}" --generate-notes
          fi
