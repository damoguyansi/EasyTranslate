<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; script-src 'self'" />
  <title>钉图</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
    img { display: block; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
    body { cursor: grab; outline: 1px solid rgba(10, 132, 255, 0); transition: outline-color .15s; outline-offset: -1px; }
    body:hover { outline-color: rgba(10, 132, 255, .7); }
    body.moving { cursor: grabbing; }
    .zoom { position: fixed; right: 6px; bottom: 6px; padding: 2px 6px; border-radius: 5px; background: rgba(0,0,0,.65); color: #fff; font: 11px -apple-system, sans-serif; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .zoom.show { opacity: 1; }
  </style>
</head>
<body>
  <img id="img" alt="" />
  <div class="zoom" id="zoom"></div>
  <script type="module" src="./pin.js"></script>
</body>
</html>
